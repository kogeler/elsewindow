version: 2
updates:
  # Native requirements inputs own direct versions and pip-compile owns their
  # generated locks. Keep the coordinated runtime dependency manual and group
  # every other Python version update into one resolver change. Security fixes
  # get their own group so one pull request clears all of them together.
  - package-ecosystem: pip
    directories:
      - /
      - /elsewindow
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    exclude-paths:
      - pyproject.toml
    ignore:
      - dependency-name: "ssh-wrapper"
    groups:
      python-dependencies:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
